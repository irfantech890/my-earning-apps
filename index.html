<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crypto Mining & Rewards Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a24;
      --accent-color: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.35);
      --text-color: #ffffff;
      --text-dim: #8a99ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }

    .header-card { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 42px; height: 42px; border-radius: 50%; background: #232d3f; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-color); border: 2px solid var(--accent-color); }
    .balance-amount { font-size: 22px; font-weight: 800; color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); }

    .tap-section { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 20px 0; }
    .tap-button { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); border: 4px solid var(--accent-color); box-shadow: 0 0 30px var(--accent-glow); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .tap-button:active { transform: scale(0.94); }
    .tap-button i { font-size: 60px; color: var(--accent-color); }

    .energy-container { width: 100%; max-width: 400px; margin-top: 15px; }
    .energy-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    .energy-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .energy-bar-fill { width: 100%; height: 100%; background: var(--accent-color); transition: width 0.3s ease; }

    .task-hub { width: 100%; max-width: 400px; margin-top: 24px; }
    .hub-title { font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .task-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .task-info { display: flex; align-items: center; gap: 12px; }
    .task-icon { width: 42px; height: 42px; border-radius: 10px; background: rgba(0, 255, 136, 0.1); color: var(--accent-color); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .task-btn { background: var(--accent-color); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .task-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

    .toast { position: fixed; bottom: 20px; background: #1e293b; color: #fff; border: 1px solid var(--accent-color); padding: 12px 24px; border-radius: 30px; font-size: 12px; display: none; z-index: 100; }
  </style>

  <!-- Monetag Dedicated Telegram Mini App (TMA) SDK Scripts -->
  <script src="//libtl.com/sdk.js" data-zone="12106123" data-sdk="show_12106123"></script>
  <script src="//libtl.com/sdk.js" data-zone="12106130" data-sdk="show_12106130"></script>
  <script src="//libtl.com/sdk.js" data-zone="12106139" data-sdk="show_12106139"></script>
</head>
<body>

  <div class="header-card">
    <div class="user-info">
      <div class="user-avatar" id="uAvatar">U</div>
      <div>
        <div id="uName" style="font-weight: 700; font-size: 14px;">User</div>
        <div style="font-size: 10px; color: var(--text-dim);">Mining Active</div>
      </div>
    </div>
    <div>
      <div style="font-size: 11px; color: var(--text-dim); text-align: right;">TOKENS</div>
      <div class="balance-amount" id="coinBalance">0</div>
    </div>
  </div>

  <div class="tap-section">
    <div class="tap-button" id="tapBtn">
      <i class="fa-solid fa-bolt"></i>
      <div style="margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--text-dim);">TAP TO MINE</div>
    </div>
  </div>

  <div class="energy-container">
    <div class="energy-stats">
      <span><i class="fa-solid fa-battery-half"></i> Energy</span>
      <span id="energyText">500 / 500</span>
    </div>
    <div class="energy-bar-bg">
      <div class="energy-bar-fill" id="energyFill"></div>
    </div>
  </div>

  <div class="task-hub">
    <div class="hub-title"><i class="fa-solid fa-gem" style="color: var(--accent-color);"></i> High Reward Tasks</div>

    <div class="task-card">
      <div class="task-info">
        <div class="task-icon"><i class="fa-solid fa-play"></i></div>
        <div>
          <h4>Watch Ad Booster</h4>
          <p style="font-size:11px; color: var(--accent-color);">+500 Tokens</p>
        </div>
      </div>
      <button class="task-btn" id="watchAdBtn" onclick="showAdWithRotation()">CLAIM</button>
    </div>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script>
    // Telegram WebApp Config
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const userId = tg?.initDataUnsafe?.user?.id || "USER_123456";
    const userName = tg?.initDataUnsafe?.user?.first_name || "Guest";

    document.getElementById('uName').innerText = userName;
    document.getElementById('uAvatar').innerText = userName.charAt(0).toUpperCase();

    let coins = parseInt(localStorage.getItem('user_coins')) || 0;
    let energy = parseInt(localStorage.getItem('user_energy')) || 500;
    const maxEnergy = 500;

    document.getElementById('coinBalance').innerText = coins.toLocaleString();

    document.getElementById('tapBtn').addEventListener('click', () => {
      if (energy >= 1) {
        coins += 1;
        energy -= 1;
        document.getElementById('coinBalance').innerText = coins.toLocaleString();
        document.getElementById('energyText').innerText = `${energy} / ${maxEnergy}`;
        document.getElementById('energyFill').style.width = (energy / maxEnergy * 100) + "%";
        localStorage.setItem('user_coins', coins);
        localStorage.setItem('user_energy', energy);
      } else {
        showToast("Energy Empty!");
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Monetag TMA SDK Execution with 3-Zone Rotation
    const sdkZones = ['12106123', '12106130', '12106139'];
    let currentIdx = 0;

    function showAdWithRotation() {
      const btn = document.getElementById('watchAdBtn');
      btn.disabled = true;
      btn.innerText = "Loading...";

      attemptZoneAd(0);
    }

    function attemptZoneAd(retryCount) {
      if (retryCount >= sdkZones.length) {
        showToast("No ads available right now. Try again later.");
        resetBtn();
        return;
      }

      const zoneId = sdkZones[currentIdx];
      currentIdx = (currentIdx + 1) % sdkZones.length; // Rotation

      const fnName = `show_${zoneId}`;

      if (typeof window[fnName] === 'function') {
        window[fnName]({
          ymid: userId.toString()
        }).then(() => {
          coins += 500;
          localStorage.setItem('user_coins', coins);
          document.getElementById('coinBalance').innerText = coins.toLocaleString();
          showToast("Success! +500 Tokens added.");
          resetBtn();
        }).catch((err) => {
          console.log(`Zone ${zoneId} failed/skipped. Trying next...`, err);
          attemptZoneAd(retryCount + 1);
        });
      } else {
        console.log(`SDK Function ${fnName} not initialized yet. Trying next...`);
        attemptZoneAd(retryCount + 1);
      }
    }

    function resetBtn() {
      const btn = document.getElementById('watchAdBtn');
      btn.disabled = false;
      btn.innerText = "CLAIM";
    }
  </script>
</body>
</html>
