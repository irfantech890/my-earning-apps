<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GigaPub Ad Tasker</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #007bff;
            --background-color: #f4f7f9;
            --card-background: #ffffff;
            --text-color: #212529;
            --text-light: #6c757d;
            --border-color: #dee2e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .total-clicks-card {
            background-color: var(--card-background);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .total-clicks-card h2 {
            font-size: 15px;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #total-clicks-display {
            font-size: 52px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1;
        }
        .ad-card {
            background-color: var(--card-background);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .single-ad-button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: #ffffff;
            background-color: var(--primary-color);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .single-ad-button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Clicks Display -->
        <div class="total-clicks-card">
            <h2>TOTAL CLICKS</h2>
            <p id="total-clicks-display">0</p>
        </div>

        <!-- Single Ad Button -->
        <div class="ad-card">
            <button id="view-ad-btn" class="single-ad-button">
                <i class="fas fa-play"></i> View Ad
            </button>
        </div>
    </div>

    <script>
    // --- Configuration (এখানে ZONE ID দেওয়া আছে) ---
    const ADS_CONFIG = [
        { id: 'g1', zone: 9273, ads: 'gigapub' }
    ];

    const tg = window.Telegram?.WebApp;
    let totalClicks = 0;

    // --- App Initialization ---
    window.addEventListener('load', initApp);

    function initApp() {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.ready();
            tg.expand();
        }
        loadAllAdSDKs();
        loadState();
        document.getElementById('view-ad-btn').addEventListener('click', handleAdClick);
    }

    // --- State Management ---
    function loadState() {
        totalClicks = parseInt(localStorage.getItem('gigaPubClicks')) || 0;
        updateDisplay();
    }

    function saveState() {
        localStorage.setItem('gigaPubClicks', totalClicks);
    }

    function updateDisplay() {
        document.getElementById('total-clicks-display').textContent = totalClicks;
    }

    // --- Ad SDK Loading (Dynamic by ZONE ID) ---
    function loadAllAdSDKs() {
        ADS_CONFIG.forEach(task => {
            if (task.ads === 'gigapub') {
                const script = document.createElement('script');
                script.async = true;
                script.src = `https://ad.gigapub.tech/script?id=${task.zone}`;
                document.head.appendChild(script);
            }
        });
    }

    // --- Ad Click Action (ক্লিক করার সাথে সাথে কাউন্ট ও অ্যাড রান হবে) ---
    function handleAdClick() {
        // ১. ক্লিক করার সাথেই কাউন্ট বৃদ্ধি পাবে
        totalClicks++;
        saveState();
        updateDisplay();

        // ২. কোনো অপেক্ষা বা অ্যালার্ট ছাড়াই সরাসরি অ্যাড কল হবে
        if (typeof window.showGiga === 'function') {
            window.showGiga().catch(e => console.error("Ad closed or failed:", e));
        } else {
            console.warn("GigaPub SDK is loading...");
        }
    }
    </script>
</body>
</html>
