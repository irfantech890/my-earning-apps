<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crypto Mining & Rewards Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a24;
      --accent-color: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.35);
      --text-color: #ffffff;
      --text-dim: #8a99ad;
      --warning-color: #ffaa00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .header-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #232d3f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
    }

    .balance-container {
      text-align: right;
    }

    .balance-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-amount {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .tap-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .tap-button {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 4px solid var(--accent-color);
      box-shadow: 0 0 30px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .tap-button:active {
      transform: scale(0.94);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .tap-button i {
      font-size: 60px;
      color: var(--accent-color);
    }

    .tap-text {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .energy-container {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
    }

    .energy-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .energy-bar-bg {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .energy-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.3s ease;
    }

    .task-hub {
      width: 100%;
      max-width: 400px;
      margin-top: 24px;
    }

    .hub-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .task-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .task-details h4 {
      font-size: 14px;
      font-weight: 600;
    }

    .task-details p {
      font-size: 11px;
      color: var(--accent-color);
      margin-top: 2px;
    }

    .task-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .task-btn:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      background: #1e293b;
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 12px;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 100;
    }
  </style>

  <!-- Monetag 3 Zone Scripts (Zone IDs: 12106123, 12106130, 12106139) -->
  <script src="https://alwingulla.com/88/tag.min.js" data-zone="12106123" async data-cfasync="false"></script>
  <script src="https://alwingulla.com/88/tag.min.js" data-zone="12106130" async data-cfasync="false"></script>
  <script src="https://alwingulla.com/88/tag.min.js" data-zone="12106139" async data-cfasync="false"></script>
</head>
<body>

  <!-- 1. Bot & Automation Protection Script -->
  <script>
    if (navigator.webdriver || window.outerWidth === 0 || window.outerHeight === 0) {
        document.body.innerHTML = "<h2 style='color:#ff4d4d; text-align:center; margin-top:100px; font-family:sans-serif;'>Access Denied: Automated Environment Blocked</h2>";
        throw new Error("Bot blocked");
    }
  </script>

  <!-- Top Stats -->
  <div class="header-card">
    <div class="user-info">
      <div class="user-avatar" id="uAvatar">U</div>
      <div>
        <div id="uName" style="font-weight: 700; font-size: 14px;">User</div>
        <div style="font-size: 10px; color: var(--text-dim);">Global Active Member</div>
      </div>
    </div>
    <div class="balance-container">
      <div class="balance-title">Tokens</div>
      <div class="balance-amount" id="coinBalance">0</div>
    </div>
  </div>

  <!-- Tap Mining -->
  <div class="tap-section">
    <div class="tap-button" id="tapBtn">
      <i class="fa-solid fa-bolt"></i>
      <div class="tap-text">TAP TO MINE</div>
    </div>
  </div>

  <!-- Energy Bar -->
  <div class="energy-container">
    <div class="energy-stats">
      <span><i class="fa-solid fa-battery-half"></i> Energy Left</span>
      <span id="energyText">500 / 500</span>
    </div>
    <div class="energy-bar-bg">
      <div class="energy-bar-fill" id="energyFill"></div>
    </div>
  </div>

  <!-- Task Hub -->
  <div class="task-hub">
    <div class="hub-title">
      <i class="fa-solid fa-gem" style="color: var(--accent-color);"></i>
      High Reward Tasks
    </div>

    <!-- Task 1 -->
    <div class="task-card">
      <div class="task-info">
        <div class="task-icon"><i class="fa-solid fa-play"></i></div>
        <div class="task-details">
          <h4>Watch Ad Booster</h4>
          <p>+500 Tokens (2 Min Cooldown)</p>
        </div>
      </div>
      <button class="task-btn" id="watchAdBtn" onclick="triggerRewardedAd()">CLAIM</button>
    </div>

    <!-- Task 2 -->
    <div class="task-card">
      <div class="task-info">
        <div class="task-icon"><i class="fa-solid fa-charging-station"></i></div>
        <div class="task-details">
          <h4>Instant Full Energy</h4>
          <p>Restore 500/500 Energy</p>
        </div>
      </div>
      <button class="task-btn" id="refillBtn" onclick="triggerRefillAd()">REFILL</button>
    </div>
  </div>

  <div class="toast" id="toastMsg">Ad rewarded successfully!</div>

  <script>
    // --- TELEGRAM WEBAPP INIT ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const userId = tg?.initDataUnsafe?.user?.id || "USER_" + Math.floor(Math.random() * 899999 + 100000);
    const userName = tg?.initDataUnsafe?.user?.first_name || "Guest User";

    document.getElementById('uName').innerText = userName;
    document.getElementById('uAvatar').innerText = userName.charAt(0).toUpperCase();

    let coins = parseInt(localStorage.getItem('user_coins')) || 0;
    let energy = parseInt(localStorage.getItem('user_energy')) || 500;
    const maxEnergy = 500;
    let lastAdTime = parseInt(localStorage.getItem('last_ad_time')) || 0;

    document.getElementById('coinBalance').innerText = coins.toLocaleString();
    updateEnergyUI();

    document.getElementById('tapBtn').addEventListener('click', () => {
      if (energy >= 1) {
        coins += 1;
        energy -= 1;
        saveData();
        updateEnergyUI();
        document.getElementById('coinBalance').innerText = coins.toLocaleString();
      } else {
        showToast("Energy Empty! Watch an Ad to refill.");
      }
    });

    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 1);
        updateEnergyUI();
        saveData();
      }
    }, 3000);

    function updateEnergyUI() {
      document.getElementById('energyText').innerText = `${energy} / ${maxEnergy}`;
      const percentage = (energy / maxEnergy) * 100;
      document.getElementById('energyFill').style.width = percentage + "%";
    }

    function saveData() {
      localStorage.setItem('user_coins', coins);
      localStorage.setItem('user_energy', energy);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // --- 3-ZONE ROTATION & FALLBACK SYSTEM ---
    const zoneIds = ['12106123', '12106130', '12106139'];
    let currentZoneIndex = 0;

    function getRotatedZoneId() {
      const zoneId = zoneIds[currentZoneIndex];
      currentZoneIndex = (currentZoneIndex + 1) % zoneIds.length;
      return zoneId;
    }

    function preloadMonetagAd() {
      const activeZone = getRotatedZoneId();
      const fnName = `show_${activeZone}`;
      if (typeof window[fnName] === 'function') {
        window[fnName]({
          type: 'preload',
          ymid: userId.toString(),
          requestVar: 'tma_mining_app'
        }).then(() => {
          console.log(`Zone ${activeZone} Preloaded Successfully.`);
        }).catch(err => console.log("Preload Error:", err));
      }
    }

    window.addEventListener('load', () => {
      setTimeout(preloadMonetagAd, 2000);
      checkAdCooldown();
    });

    function checkAdCooldown() {
      const now = Date.now();
      const btn = document.getElementById('watchAdBtn');
      if (now - lastAdTime < 120000) {
        const remainingSec = Math.ceil((120000 - (now - lastAdTime)) / 1000);
        btn.disabled = true;
        btn.innerText = `${remainingSec}s`;
        setTimeout(checkAdCooldown, 1000);
      } else {
        btn.disabled = false;
        btn.innerText = "CLAIM";
      }
    }

    // Task 1: Rewarded Ad (With Page Visibility & Bot Protection)
    function triggerRewardedAd() {
      if (document.hidden) {
        showToast("Please stay active on the app to watch the ad!");
        return;
      }

      attemptShowAd(0, (rewarded) => {
        coins += 500;
        lastAdTime = Date.now();
        localStorage.setItem('last_ad_time', lastAdTime);
        saveData();
        document.getElementById('coinBalance').innerText = coins.toLocaleString();
        showToast("Success! +500 Tokens added.");
        checkAdCooldown();
        preloadMonetagAd();
      });
    }

    // Task 2: Energy Refill Ad (With Page Visibility & Bot Protection)
    function triggerRefillAd() {
      if (document.hidden) {
        showToast("Please stay active on the app to watch the ad!");
        return;
      }

      attemptShowAd(0, (rewarded) => {
        energy = maxEnergy;
        updateEnergyUI();
        saveData();
        showToast("Energy fully restored!");
        preloadMonetagAd();
      });
    }

    // Fallback Ad Executor Across Your 3 Zones
    function attemptShowAd(retryCount, successCallback) {
      if (retryCount >= zoneIds.length) {
        showToast("Ad not available right now. Try again later.");
        return;
      }

      const zoneId = zoneIds[(currentZoneIndex + retryCount) % zoneIds.length];
      const fnName = `show_${zoneId}`;

      if (typeof window[fnName] === 'function') {
        window[fnName]({
          type: 'end',
          ymid: userId.toString()
        }).then((result) => {
          successCallback(result);
        }).catch((err) => {
          console.log(`Zone ${zoneId} failed, trying next zone...`, err);
          attemptShowAd(retryCount + 1, successCallback);
        });
      } else {
        attemptShowAd(retryCount + 1, successCallback);
      }
    }
  </script>
</body>
</html>
